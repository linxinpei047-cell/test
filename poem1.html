<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>詩的賞析1 - 將進酒</title>
    <style>
        /* 1. 整頁背景設為粉紅色 */
        body {
            background-color: pink;
            text-align: center;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 20px;
        }

        /* 2. 詩的標題設為: 藍色、40點字 (40pt) */
        h1 {
            color: blue;
            font-size: 40pt;
            margin-bottom: 20px;
        }

        /* 2. 詩的內容設為: 綠色、30點字 (30pt) */
        .poem-content {
            color: green;
            font-size: 30pt;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* 3. 頁面中央放1楨李白的畫像圖 (寬度300px，深紫色圖框線5px，圓角50px) */
        .poet-img {
            width: 300px;
            height: auto;
            border: 5px solid #4B0082; /* 深紫色 */
            border-radius: 50px;
            display: block;
            margin: 0 auto 30px auto;
        }

        /* 返回按鈕 */
        .back-link {
            font-size: 16pt;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>將進酒</h1>

    <!-- 3. 李白畫像 (請替換為實際圖片檔名/路徑) -->
    <img src="libai.jpg" alt="李白畫像" class="poet-img">

    <div class="poem-content">
        君不見黃河之水天上來，奔流到海不復回！<br>
        君不見高堂明鏡悲白髮，朝如青絲暮成雪！<br>
        人生得意須盡歡，莫使金樽空對月。<br>
        天生我材必有用，千金散盡還復來。<br>
        烹羊宰牛且爲樂，會須一飲三百杯。<br>
        岑夫子，丹丘生，將進酒，杯莫停。<br>
        與君歌一曲，請君爲我傾耳聽。<br>
        鐘鼓饌玉不足貴，但願長醉不復醒。<br>
        古來聖賢皆寂寞，惟有飲者留其名。<br>
        陳王昔時宴平樂，斗酒十千恣歡謔。<br>
        主人何為言少錢，徑須沽取對君酌。<br>
        五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。
    </div>

    <a href="index.html" class="back-link">← 返回個人網頁</a>

</body>
</html>
